[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "storyroom"
version = "0.1.0"
description = "Local footage-to-story workspace"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "python-dotenv>=1,<2", "httpx>=0.27,<1", "google-genai>=1,<3", "opentimelineio>=0.17,<1", "otio-fcp-adapter>=1,<2", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "scikit-learn>=1.5,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
server = ["schema_v1.sql"]
